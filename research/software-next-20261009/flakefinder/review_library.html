<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlakeFinder · Saved runs</title><style>
:root{color-scheme:dark;font:15px/1.5 system-ui,Segoe UI,sans-serif;color:#e6eef5;background:#10171e}*{box-sizing:border-box}body{margin:0}header{padding:18px 28px;border-bottom:1px solid #31434f;display:flex;align-items:center;gap:24px;background:#141e27}header strong{font-size:20px}a{color:#9ac4ff}header a{text-decoration:none;font-size:13px}.spacer{flex:1}main{max-width:1150px;margin:auto;padding:42px 24px}h1{font-size:34px;line-height:1.2;margin:0 0 10px}.muted{color:#9aafbd}.intro{max-width:760px;margin-bottom:26px}.toolbar{display:flex;align-items:center;gap:18px;margin-bottom:24px}input{font:inherit;color:inherit;background:#15232d;border:1px solid #3b5261;border-radius:7px;padding:10px}input[type=search]{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}.card{display:flex;flex-direction:column;gap:14px;padding:23px;background:#18242e;border:1px solid #31434f;border-radius:12px;color:inherit;text-decoration:none;min-height:235px}.card:hover,.card:focus-visible{border-color:#70dcc3;outline:1px solid #70dcc3}.card h2{font-size:19px;margin:0;overflow-wrap:anywhere}.badge{font-size:12px;color:#70dcc3}.meta{font-size:12px;color:#9aafbd;overflow-wrap:anywhere}.metrics{display:flex;gap:26px;margin-top:auto}.metrics b{display:block;font-size:24px}.metrics small{color:#9aafbd}.open{color:#9ac4ff;font-size:13px}.empty{padding:40px;border:1px dashed #31434f;border-radius:10px}.notice{padding:12px;border:1px solid #976e41;color:#eacb9e;border-radius:8px;margin:15px 0}[hidden]{display:none!important}@media(max-width:600px){header{padding:14px;gap:12px}main{padding:26px 14px}.toolbar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><header><strong>FlakeFinder</strong><span class="muted">Saved runs</span><div class="spacer"></div><a href="/">Home</a><a href="/scan">New scan</a></header><main><div class="intro"><h1>Saved scans</h1><p class="muted">Graphene, hBN and MoTe₂ results.</p></div><div class="toolbar"><input id="search" type="search" aria-label="Search saved runs" placeholder="Search operator, scan, material or run…"><label><input id="older" type="checkbox"> Include older analyses</label></div><p id="summary" class="muted">Loading saved runs…</p><div id="warning" class="notice" hidden></div><div id="runs" class="grid"></div></main><script>
'use strict';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let runs=[];
function render(){const needle=$('search').value.trim().toLowerCase(),visible=runs.filter(r=>($('older').checked||r.curated||r.kind==='workflow')&&[r.title,r.material,r.id,r.operator_name].join(' ').toLowerCase().includes(needle));$('summary').textContent=visible.length+' saved '+(visible.length===1?'run':'runs');$('runs').innerHTML=visible.length?visible.map(r=>'<a class="card" href="'+esc(r.href)+'"><span class="badge">'+esc(r.material)+(r.oxide_nm?' · '+esc(r.oxide_nm)+' nm SiO₂':'')+' · '+(r.kind==='workflow'?'Processing':r.curated?'Selected analysis':'Earlier analysis')+'</span><h2>'+esc(r.title)+'</h2><div class="meta">'+esc(r.id)+'<br>'+esc(r.version)+' · '+esc(String(r.state).replaceAll('_',' '))+(r.operator_name?'<br>Operator: '+esc(r.operator_name):'')+(r.phase?'<br>'+esc(String(r.phase).replaceAll('_',' ')):'')+(r.reason?'<br>'+esc(r.reason):'')+'</div><div class="metrics"><div><b>'+Number(r.fields||0).toLocaleString()+'</b><small>fields processed</small></div>'+(r.assessed_fields!=null?'<div><b>'+Number(r.assessed_fields).toLocaleString()+'</b><small>fields assessed</small></div>':'')+'</div><span class="open">Open '+(r.kind==='workflow'?'processing status':['graphene','hbn'].includes(r.kind)?'flake review':'image library')+' →</span></a>').join(''):'<div class="empty">No matching scans.</div>'}
$('search').oninput=render;$('older').onchange=render;fetch('/api/review-runs').then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load saved runs');runs=d.runs;render();if(d.warnings.length){$('warning').hidden=false;$('warning').textContent=d.warnings.join(' · ')}}).catch(e=>{$('summary').textContent='Saved runs unavailable';$('warning').hidden=false;$('warning').textContent=e.message});
</script></body></html>
