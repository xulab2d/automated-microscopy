<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlakeFinder · Processing</title><style>
:root{color-scheme:dark;font:15px/1.5 system-ui;background:#10171e;color:#e6eef5}*{box-sizing:border-box}body{margin:0}a{color:#9ac4ff}header{padding:18px 28px;border-bottom:1px solid #31434f;display:flex;gap:24px}header a{text-decoration:none}main{max-width:950px;margin:auto;padding:35px 24px}h1{margin-bottom:8px}.muted{color:#9aafbd}.panel{padding:22px;border:1px solid #31434f;border-radius:10px;margin:18px 0;background:#18242e}.state{color:#70dcc3;font-size:22px}.error{color:#ffb0ad}.chips{display:grid;gap:12px}.chip{border-top:1px solid #31434f;padding-top:14px}.chip span{display:inline-block;margin-right:18px}small{color:#9aafbd}button{font:inherit;padding:8px 14px;border:1px solid #31434f;border-radius:6px;background:#18242e;color:inherit;cursor:pointer}[hidden]{display:none!important}
</style></head><body><header><strong>FlakeFinder</strong><a href="/">Home</a><a href="/review">Review runs</a><a href="/scan">Microscope</a></header><main><h1>Analysis status</h1><div id="identity" class="muted"></div><section class="panel" aria-live="polite"><div id="state" class="state">Loading…</div><p id="phase"></p><p id="reason" class="error" hidden></p><p id="acquisition" class="muted"></p><p id="child" class="muted"></p><small id="updated"></small></section><div id="chips" class="panel chips"></div><div id="inherited" class="panel" hidden></div></main><script>
'use strict';const $=id=>document.getElementById(id),run=new URLSearchParams(location.search).get('run')||'',human=s=>String(s||'').replaceAll('_',' '),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('identity').textContent=run;
async function refresh(){try{const r=await fetch('/api/analysis-workflow?run='+encodeURIComponent(run),{cache:'no-store'});const a=await r.json();if(!r.ok)throw new Error(a.error||'Processing status unavailable');$('state').textContent=human(a.state);$('phase').textContent=[a.chip,human(a.phase)].filter(Boolean).join(' · ');$('reason').hidden=!a.reason||!['failed','enqueue_failed','unavailable','unsupported','stopped','needs_attention'].includes(a.state);$('reason').textContent=a.reason||'';$('acquisition').textContent=a.acquisition?'Acquisition: '+human(a.acquisition.state)+(a.acquisition.error?' · '+a.acquisition.error:''):'';const inherited=Object.entries(a.readonly_reviews||{});$('inherited').hidden=!inherited.length;$('inherited').innerHTML=inherited.map(([id,v])=>'<div class="chip"><b>'+esc(id)+' · retained source</b><p>'+esc(human(v.state))+(v.reason?' · '+esc(v.reason):'')+'</p>'+(v.review_url?'<a href="'+esc(v.review_url)+'">Review original chip →</a>':'')+'</div>').join('');const c=a.child||{};$('child').textContent=c.state?'Current stage: '+human(c.state)+(c.finished_fields!=null?' · '+c.finished_fields+' fields processed':''):'';$('updated').textContent=a.updated_at?'Saved '+new Date(a.updated_at*1000).toLocaleString():'';const chips=Object.entries(a.chips||{});$('chips').innerHTML=chips.length?chips.map(([id,v])=>'<div class="chip"><b>'+esc(id)+'</b><p>'+['analysis','refinement','dedup'].map(k=>'<span>'+esc(human(k))+': '+esc(human(v[k]?.state||'pending'))+'</span>').join('')+'</p>'+(v.review_url?'<a href="'+esc(v.review_url)+'">Review this chip →</a>':'')+'</div>').join(''):'<span class="muted">No processed chips.</span>';}catch(e){$('state').textContent='Status unavailable';$('reason').hidden=false;$('reason').textContent=e.message;}}
refresh();setInterval(refresh,5000);
</script></body></html>
